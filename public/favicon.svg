<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle / transparent container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>

    <linearGradient id="favBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#4A0000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean rounded background badge to ensure visibility on light or dark browser tabs & Google search -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)" stroke="#F1F5F9" stroke-width="2" />

  <g filter="url(#favShadow)" transform="translate(6, 4) scale(0.92)">
    <!-- Lightbulb Sparks -->
    <polygon points="18,16 23,12 21,18 26,17 21,26 22,20 18,21" fill="url(#favBevel)" />
    <polygon points="36,12 41,16 37,21 42,20 37,26 38,18 36,17" fill="url(#favBevel)" />

    <!-- Bulb Outline -->
    <path d="M 22,34 C 18,28 20,20 27,17 C 35,13 42,19 41,28 C 40,33 37,36 36,41 L 28,41 C 27,37 25,35 22,34 Z"
          fill="none" stroke="url(#favRed)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Bulb Filament -->
    <path d="M 30,23 C 27,24 26,27 28,29 C 30,31 32,30 32,28 L 32,22"
          fill="none" stroke="url(#favRed)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 32,26 L 36,24" fill="none" stroke="url(#favRed)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Screw threads -->
    <path d="M 28,43 Q 32,45 36,43" fill="none" stroke="url(#favRed)" stroke-width="2" stroke-linecap="round" />
    <path d="M 29,46 Q 32,48 35,46" fill="none" stroke="url(#favRed)" stroke-width="2" stroke-linecap="round" />

    <!-- Connecting stem & Script M -->
    <path d="M 32,48 L 29,66 C 27,73 24,75 22,70"
          fill="none" stroke="url(#favRed)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Big 3D script M -->
    <path d="M 24,68 L 35,38 C 38,30 43,30 46,38 L 50,56 C 52,48 57,32 66,32 C 75,32 78,41 73,53 C 69,63 63,67 59,67 C 55,67 56,62 60,56 C 64,49 74,51 82,58 C 86,61 89,61 93,58"
          fill="none" stroke="url(#favRed)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Text MARK -->
    <g transform="translate(80, 36)">
      <text x="0" y="8" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="url(#favRed)" letter-spacing="1">MARK</text>
    </g>

    <!-- Capsule @ ADS -->
    <g transform="translate(78, 48)">
      <rect x="0" y="0" width="46" height="15" rx="7.5" fill="url(#favRed)" />
      <text x="5" y="11" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">@ADS</text>
    </g>
  </g>
</svg>
