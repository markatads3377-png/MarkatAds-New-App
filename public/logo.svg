<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- 3D Red Gradients -->
    <linearGradient id="red3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#E53935" />
      <stop offset="85%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#8E0000" />
    </linearGradient>

    <linearGradient id="redBevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A80" />
      <stop offset="50%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="redShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C62828" />
      <stop offset="100%" stop-color="#5F0000" />
    </linearGradient>

    <linearGradient id="whiteCutout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </linearGradient>

    <!-- 3D Depth Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#4A0000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#shadow3d)">
    <!-- 1. LEFT LIGHTNING BOLTS (SPARKS) -->
    <!-- Left bolt -->
    <polygon points="105,65 125,50 118,72 136,70 115,102 120,82 105,85" fill="url(#redBevelLight)" />
    <!-- Right bolt -->
    <polygon points="195,50 215,65 200,85 218,82 196,102 214,70 207,72" fill="url(#redBevelLight)" />

    <!-- 2. LIGHTBULB BODY -->
    <!-- Bulb Glass Outline (thick 3D red curve) -->
    <path d="M 125,145 C 105,120 110,85 140,70 C 175,55 210,80 205,120 C 200,140 185,155 180,175 L 145,175 C 140,158 135,150 125,145 Z"
          fill="none" stroke="url(#red3d)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bulb Filament (inner monogram / filament) -->
    <path d="M 152,100 C 143,103 140,113 146,122 C 151,128 160,126 160,120 L 160,95"
          fill="none" stroke="url(#red3d)" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 160,112 L 175,102"
          fill="none" stroke="url(#red3d)" stroke-width="6" stroke-linecap="round" />
    <path d="M 160,120 L 172,130"
          fill="none" stroke="url(#red3d)" stroke-width="6" stroke-linecap="round" />

    <!-- Bulb Base Screw Threads -->
    <path d="M 143,184 Q 162,192 182,184" fill="none" stroke="url(#red3d)" stroke-width="8" stroke-linecap="round" />
    <path d="M 145,195 Q 162,203 180,195" fill="none" stroke="url(#red3d)" stroke-width="8" stroke-linecap="round" />
    <path d="M 148,206 Q 162,213 177,206" fill="none" stroke="url(#red3d)" stroke-width="7" stroke-linecap="round" />

    <!-- 3. CONNECTING STEM FROM BULB DOWN TO SCRIPT 'M' -->
    <path d="M 162,212 L 158,225 L 140,300 C 135,320 125,325 120,310 C 115,295 130,225 145,200"
          fill="none" stroke="url(#red3d)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 4. GRAND 3D SCRIPT 'M' -->
    <!-- Downstroke & sweep -->
    <path d="M 130,295 L 175,180 C 185,150 208,150 218,180 L 235,260 C 242,220 262,150 295,150 C 330,150 345,190 325,245 C 310,285 285,305 270,305 C 255,305 258,285 272,260 C 290,230 330,235 365,265 C 385,282 395,282 410,270"
          fill="none" stroke="url(#red3d)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3D Highlight tube reflection over M -->
    <path d="M 174,183 C 184,155 205,155 215,183 L 232,255 C 240,220 260,155 292,155 C 322,155 336,190 318,242"
          fill="none" stroke="url(#redBevelLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- 5. 3D TEXT "MARK" (Top line to the right of M) -->
    <g transform="translate(365, 172)">
      <!-- Under-shadow extrusions for MARK -->
      <text x="0" y="32" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="44" font-weight="900" fill="url(#redShadow)" letter-spacing="3">MARK</text>
      <!-- Main Face -->
      <text x="-2" y="29" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="44" font-weight="900" fill="url(#red3d)" letter-spacing="3">MARK</text>
      <!-- Top Bevel Highlight -->
      <text x="-3" y="27" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="44" font-weight="900" fill="url(#redBevelLight)" letter-spacing="3" opacity="0.35">MARK</text>
    </g>

    <!-- 6. 3D CAPSULE BADGE "@ ADS" (Bottom pill button) -->
    <g transform="translate(355, 222)">
      <!-- 3D Pill Outer Extrusion Shadow -->
      <rect x="0" y="4" width="195" height="54" rx="27" fill="url(#redShadow)" />
      
      <!-- 3D Pill Main Face -->
      <rect x="0" y="0" width="195" height="52" rx="26" fill="url(#red3d)" stroke="url(#redBevelLight)" stroke-width="3" />
      
      <!-- Subtle internal glossy rim -->
      <rect x="3" y="2" width="189" height="24" rx="12" fill="white" opacity="0.15" />

      <!-- "@ ADS" Text Cutout / 3D Emboss -->
      <!-- Shadow -->
      <text x="22" y="38" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="32" font-weight="900" fill="#6A0000" letter-spacing="2">@ ADS</text>
      <!-- Face -->
      <text x="21" y="36" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="32" font-weight="900" fill="url(#whiteCutout)" letter-spacing="2">@ ADS</text>
    </g>
  </g>
</svg>
